<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1250" viewBox="0 0 1280 1250" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="20" width="400" height="1140" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="230.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">DEVELOPER LAPTOP</text><rect x="450" y="20" width="400" height="1140" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="650.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">GITHUB</text><rect x="870" y="20" width="380" height="1140" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="1060.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">SERVERS</text><rect x="60" y="90" width="340" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="230.0" y="111.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">1. Record the site</text><text x="230.0" y="131.0" text-anchor="middle" font-size="13" fill="#52606d">site.py record · replay · try-calls</text><text x="230.0" y="151.0" text-anchor="middle" font-size="13" fill="#52606d">(Playwright)</text><rect x="60" y="200" width="340" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="230.0" y="231.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">2. Claude drafts the files</text><text x="230.0" y="251.0" text-anchor="middle" font-size="13" fill="#52606d">venue.yaml + SKILL.md</text><rect x="60" y="310" width="340" height="72" rx="10" fill="#fff4e5" stroke="#f08c00" stroke-width="3"/><text x="230.0" y="341.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">3. Review the allow-list</text><text x="230.0" y="361.0" text-anchor="middle" font-size="13" fill="#52606d">Step 4 + security rules S1-S12</text><rect x="60" y="420" width="340" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="230.0" y="451.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">4. Push a branch</text><text x="230.0" y="471.0" text-anchor="middle" font-size="13" fill="#52606d">git push origin feat-x</text><rect x="480" y="420" width="340" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="650.0" y="451.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">butler-skill-&lt;site&gt;</text><text x="650.0" y="471.0" text-anchor="middle" font-size="13" fill="#52606d">branch feat-x</text><rect x="60" y="560" width="340" height="72" rx="10" fill="#fff9db" stroke="#e0a800" stroke-width="1.6"/><text x="230.0" y="581.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">5. Test Butler installs SKILL.md</text><text x="230.0" y="601.0" text-anchor="middle" font-size="13" fill="#52606d">from the branch link</text><text x="230.0" y="621.0" text-anchor="middle" font-size="13" fill="#52606d">(hub_install_url)</text><rect x="890" y="560" width="340" height="72" rx="10" fill="#fff9db" stroke="#e0a800" stroke-width="1.6"/><text x="1060.0" y="581.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">STAGING server</text><text x="1060.0" y="601.0" text-anchor="middle" font-size="13" fill="#52606d">fetches venue.yaml from the branch</text><text x="1060.0" y="621.0" text-anchor="middle" font-size="13" fill="#52606d">your test Butler only</text><rect x="60" y="700" width="340" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="230.0" y="731.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">6. Works? Merge, bump, tag</text><text x="230.0" y="751.0" text-anchor="middle" font-size="13" fill="#52606d">version 1.3.0 · git tag v1.3.0</text><rect x="480" y="700" width="340" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="650.0" y="731.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">butler-skill-&lt;site&gt;</text><text x="650.0" y="751.0" text-anchor="middle" font-size="13" fill="#52606d">tag v1.3.0</text><rect x="60" y="810" width="340" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="230.0" y="841.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">7. Open one PR to butler-skills</text><text x="230.0" y="861.0" text-anchor="middle" font-size="13" fill="#52606d">skills.json  &quot;ref&quot;: &quot;v1.3.0&quot;</text><rect x="480" y="810" width="340" height="72" rx="10" fill="#fff4e5" stroke="#f08c00" stroke-width="3"/><text x="650.0" y="831.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">butler-skills PR</text><text x="650.0" y="851.0" text-anchor="middle" font-size="13" fill="#52606d">reviewed by butler-maintainers</text><text x="650.0" y="871.0" text-anchor="middle" font-size="13" fill="#52606d">THE release review</text><rect x="480" y="930" width="340" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="650.0" y="951.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Hub build</text><text x="650.0" y="971.0" text-anchor="middle" font-size="13" fill="#52606d">clone the tag · pin the commit</text><text x="650.0" y="991.0" text-anchor="middle" font-size="13" fill="#52606d">sha256 every file → index.json</text><rect x="480" y="1050" width="340" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="650.0" y="1081.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">GitHub Pages</text><text x="650.0" y="1101.0" text-anchor="middle" font-size="13" fill="#52606d">index.json + files</text><rect x="890" y="1050" width="340" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="1060.0" y="1071.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">PRODUCTION server</text><text x="1060.0" y="1091.0" text-anchor="middle" font-size="13" fill="#52606d">polls every 5 min · checks sha256</text><text x="1060.0" y="1111.0" text-anchor="middle" font-size="13" fill="#52606d">caches venue.yaml</text><path d="M 230.0 162 L 230.0 200" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 230.0 272 L 230.0 310" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 230.0 382 L 230.0 420" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 400 456.0 L 480 456.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="440.0" y="448.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">push</text><path d="M 590.0 492 L 590.0 530 L 230.0 530 L 230.0 560" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="350.0" y="523" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">SKILL.md</text><path d="M 710.0 492 L 710.0 530 L 1060.0 530 L 1060.0 560" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="1020.0" y="523" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">venue.yaml (by pointer)</text><path d="M 230.0 632 L 230.0 700" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="340.0" y="672" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">fix and repeat until it works</text><path d="M 400 736.0 L 480 736.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="440.0" y="728.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">push tag</text><path d="M 230.0 772 L 230.0 810" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 400 846.0 L 480 846.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="440.0" y="838.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">PR</text><path d="M 650.0 882 L 650.0 930" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="680.0" y="916" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">merge</text><path d="M 650.0 1002 L 650.0 1050" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 820 1086.0 L 890 1086.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="855.0" y="1078.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">fetch</text><text x="640.0" y="1204" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Nothing reaches owners until the butler-skills PR merges.</text><text x="640.0" y="1224" text-anchor="middle" font-size="13" fill="#52606d">Staging tests your branch. Production runs only the tag that PR points at.</text></svg>