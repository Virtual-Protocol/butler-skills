<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1310" viewBox="0 0 1400 1310" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="20" width="270" height="1200" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="165.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">OWNER</text><rect x="320" y="20" width="320" height="1200" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="480.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">BUTLER (container)</text><rect x="660" y="20" width="430" height="1200" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="875.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">BEVO SERVER (engine)</text><rect x="1110" y="20" width="260" height="1200" rx="14" fill="#fafbfc" stroke="#e4e7eb"/><text x="1240.0" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#52606d" letter-spacing="1.5">THE SITE</text><rect x="50" y="90" width="230" height="72" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><text x="165.0" y="121.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">“Long ETH $50</text><text x="165.0" y="141.0" text-anchor="middle" font-size="13" fill="#52606d">on Acme”</text><rect x="340" y="90" width="280" height="72" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="480.0" y="111.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Reads SKILL.md, runs</text><text x="480.0" y="131.0" text-anchor="middle" font-size="13" fill="#52606d">acp site acme-perps open</text><text x="480.0" y="151.0" text-anchor="middle" font-size="13" fill="#52606d">--usd 50 ...</text><rect x="685" y="200" width="380" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="875.0" y="221.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Finds acme-perps in the hub index</text><text x="875.0" y="241.0" text-anchor="middle" font-size="13" fill="#52606d">its own cached, sha256-checked</text><text x="875.0" y="261.0" text-anchor="middle" font-size="13" fill="#52606d">venue.yaml</text><rect x="685" y="310" width="380" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="875.0" y="331.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Builds the card itself</text><text x="875.0" y="351.0" text-anchor="middle" font-size="13" fill="#52606d">never the AI · stores the</text><text x="875.0" y="371.0" text-anchor="middle" font-size="13" fill="#52606d">venue.yaml sha256 with it</text><rect x="50" y="420" width="230" height="82" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="3"/><text x="165.0" y="446.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Sees the card</text><text x="165.0" y="466.0" text-anchor="middle" font-size="13" fill="#52606d">“Open a $50 long on</text><text x="165.0" y="486.0" text-anchor="middle" font-size="13" fill="#52606d">ETH on Acme” · Approve</text><rect x="685" y="530" width="380" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="875.0" y="551.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Runs the steps</text><text x="875.0" y="571.0" text-anchor="middle" font-size="13" fill="#52606d">in a cloud browser tab,</text><text x="875.0" y="591.0" text-anchor="middle" font-size="13" fill="#52606d">locked to the site</text><rect x="1130" y="530" width="220" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="1240.0" y="561.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">The page</text><text x="1240.0" y="581.0" text-anchor="middle" font-size="13" fill="#52606d">call / click</text><rect x="685" y="640" width="380" height="82" rx="10" fill="#fff4e5" stroke="#f08c00" stroke-width="3"/><text x="875.0" y="666.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Every money request and</text><text x="875.0" y="686.0" text-anchor="middle" font-size="13" fill="#52606d">signature is HELD, then checked</text><text x="875.0" y="706.0" text-anchor="middle" font-size="13" fill="#52606d">against allow + the card</text><rect x="685" y="770" width="175" height="72" rx="10" fill="#fff0f0" stroke="#e03131" stroke-width="1.6"/><text x="772.5" y="791.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">No match</text><text x="772.5" y="811.0" text-anchor="middle" font-size="13" fill="#52606d">refused,</text><text x="772.5" y="831.0" text-anchor="middle" font-size="13" fill="#52606d">nothing sent</text><rect x="890" y="770" width="175" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="977.5" y="801.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Match</text><text x="977.5" y="821.0" text-anchor="middle" font-size="13" fill="#52606d">sent ONCE</text><rect x="1130" y="770" width="220" height="72" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/><text x="1240.0" y="801.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">The site</text><text x="1240.0" y="821.0" text-anchor="middle" font-size="13" fill="#52606d">does the trade</text><rect x="685" y="880" width="380" height="72" rx="10" fill="#e6f6ec" stroke="#2f9e44" stroke-width="1.6"/><text x="875.0" y="901.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Confirm</text><text x="875.0" y="921.0" text-anchor="middle" font-size="13" fill="#52606d">read the chain or the site&#x27;s API</text><text x="875.0" y="941.0" text-anchor="middle" font-size="13" fill="#52606d">never page words</text><rect x="340" y="990" width="280" height="82" rx="10" fill="#e8f1fd" stroke="#5b8def" stroke-width="1.6"/><text x="480.0" y="1016.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">Result</text><text x="480.0" y="1036.0" text-anchor="middle" font-size="13" fill="#52606d">done / not_done / unknown</text><text x="480.0" y="1056.0" text-anchor="middle" font-size="13" fill="#52606d">typed fields, marked as site data</text><rect x="50" y="1100" width="230" height="72" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><text x="165.0" y="1131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">“Done. Filled</text><text x="165.0" y="1151.0" text-anchor="middle" font-size="13" fill="#52606d">at $3,412.”</text><path d="M 280 126.0 L 340 126.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="310.0" y="118.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">asks</text><path d="M 480.0 162 L 480.0 236.0 L 685 236.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="550.0" y="228.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">acp site</text><path d="M 875.0 272 L 875.0 310" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 685 346.0 L 165.0 346.0 L 165.0 420" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="480.0" y="338.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">card</text><path d="M 165.0 502 L 165.0 566.0 L 685 566.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="480.0" y="558.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">tap Approve</text><path d="M 1065 554.0 L 1130 554.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="1097.5" y="546.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">steps</text><path d="M 1130 580.0 L 1065 580.0" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="1097.5" y="600.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">requests,</text><text x="1097.5" y="616.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">signatures</text><path d="M 875.0 602 L 875.0 640" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 772.5 722 L 772.5 770" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 977.5 722 L 977.5 770" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 1065 806.0 L 1130 806.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="1097.5" y="798.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">once</text><path d="M 977.5 842 L 977.5 880" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M 875.0 952 L 875.0 1031.0 L 620 1031.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="915.0" y="1023.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">result</text><path d="M 480.0 1072 L 480.0 1136.0 L 280 1136.0" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><text x="420.0" y="1128.0" text-anchor="middle" font-size="12" font-style="italic" fill="#52606d">tells the owner</text><text x="700.0" y="1264" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">The AI asks, the owner approves, the server decides.</text><text x="700.0" y="1284" text-anchor="middle" font-size="13" fill="#52606d">The card, the hold and the check all run on the server, from the reviewed file.</text></svg>