name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Skills are git submodules pinned at a tagged commit of their own repo;
      # the index (files[] + sha256 + source.commit) is built from that checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A Pages deploy replaces the WHOLE site and there is no gh-pages branch to
      # seed from, so every run must produce both channels itself:
      #   stable = the latest v* tag's tree, canary = this commit's tree.
      # build_index.py refuses to overwrite a published version dir with
      # different bytes, so a skill changed without a version bump fails here
      # instead of silently republishing 1.0.0 with new content.
      # The tag's tree carries its own .gitmodules pointers, so the worktree
      # needs its own `git submodule update --init --recursive` before building.
      - name: Build stable (latest v* tag)
        run: |
          set -eu
          git fetch --tags --force
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$TAG" ]; then
            echo "no v* tag yet — stable channel not published"
            exit 0
          fi
          git worktree add /tmp/stable "$TAG"
          ( cd /tmp/stable && git submodule update --init --recursive && python3 scripts/build_index.py --channel stable --repo-tag "$TAG" )
          mkdir -p dist
          cp -R /tmp/stable/dist/. dist/
          echo "stable = $TAG"

      - name: Build canary (this commit)
        run: python3 scripts/build_index.py --channel canary --repo-tag "main-${{ github.sha }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
