name: Validate a Butler duty template
description: >-
  Checks out the calling repository, fetches the Butler Skill Hub's validator and offline
  replay harness (Virtual-Protocol/butler-skills at main) into the runner's temp directory
  — never inside the template tree — and runs `validate.py` and, when the template has a
  duty.py, `replay.py` on it. A template repo's whole CI is one step:
  `uses: Virtual-Protocol/butler-skills/.github/actions/validate@main`.

inputs:
  path:
    description: Directory of the template inside the calling repository (where recipe.json lives).
    required: false
    default: "."
  standalone:
    description: >-
      "true" (default) validates a template repository — the id comes from recipe.json.
      "false" is registry mode: the path is templates/<name> inside a butler-skills checkout.
    required: false
    default: "true"
  maintainer:
    description: >-
      "true" allows the maintainer-only `butler-` id prefix (the registry PR check decides
      for real; this only affects the template repo's own run). `bevo-` ids are always refused.
    required: false
    default: "false"
  fixture:
    description: >-
      Replay fixture(s) for duty.py — a space-separated list of basenames under the hub's
      tests/fixtures/, replayed one after another. The default is BOTH, because
      trade-activity-page is buys only: replayed alone it never reaches a duty's sell,
      perp-close or stock-sell legs, which are exactly the ones that have to derive a
      quantity from bevo.read("/user-assets"). trade-activity-mixed carries a sell, a perp
      open, a perp close, a liquidation and a tokenized-stock buy and sell.
    required: false
    default: trade-activity-page trade-activity-mixed
  params:
    description: >-
      JSON merged over recipe.json's declared defaults and exported as PARAMS for the
      replay, e.g. '{"SIZING":"fixed","SIZE_USD":25}'. Set it when the template has a
      REQUIRED setting with no default: without one the duty runs with that setting
      unset, skips every event for want of a size, and the replay reports a pass having
      recorded no action at all. Templates whose settings all have defaults need nothing
      here.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out the template
      uses: actions/checkout@v4

    # actions/checkout can only place a repository under $GITHUB_WORKSPACE, and anything
    # inside the template tree would count against its 50-file / 1 MB rules — so land the hub
    # in a scratch path, then move it to $RUNNER_TEMP before validating.
    - name: Fetch the hub tooling (Virtual-Protocol/butler-skills at main)
      uses: actions/checkout@v4
      with:
        repository: Virtual-Protocol/butler-skills
        ref: main
        path: .butler-skills-hub
        persist-credentials: false

    - name: Move the hub tooling out of the template tree
      shell: bash
      run: |
        set -eu
        HUB="$RUNNER_TEMP/butler-skills"
        rm -rf "$HUB"
        mv .butler-skills-hub "$HUB"
        echo "BUTLER_SKILLS_HUB=$HUB" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Validate the template
      shell: bash
      env:
        SKILL_PATH: ${{ inputs.path }}
        STANDALONE: ${{ inputs.standalone }}
        MAINTAINER_FLAG: ${{ inputs.maintainer == 'true' && '--maintainer' || '' }}
      run: |
        set -eu
        FLAG=""
        if [ "$STANDALONE" = "true" ]; then FLAG="--standalone"; fi
        python3 "$BUTLER_SKILLS_HUB/scripts/validate.py" $FLAG $MAINTAINER_FLAG "$SKILL_PATH"

    - name: Offline replay of duty.py
      shell: bash
      env:
        SKILL_PATH: ${{ inputs.path }}
        STANDALONE: ${{ inputs.standalone }}
        FIXTURES: ${{ inputs.fixture }}
        PARAMS_JSON: ${{ inputs.params }}
      run: |
        set -eu
        if [ ! -f "$SKILL_PATH/duty.py" ]; then
          echo "no duty.py in $SKILL_PATH — replay skipped"
          exit 0
        fi
        FLAG=""
        if [ "$STANDALONE" = "true" ]; then FLAG="--standalone"; fi
        # Computed here, not in the validate step: each step is its own shell, and only
        # this step's env carries PARAMS_JSON (under `set -u` the validate step died on it).
        PARAMS_ARG=""
        if [ -n "$PARAMS_JSON" ]; then PARAMS_ARG="--params"; fi
        # One replay per fixture: a buys-only feed never exercises the legs that size a
        # quantity themselves. Unquoted on purpose — $FIXTURES is a space-separated list.
        # Each run gets its own fresh temp state dir, so nothing leaks between fixtures.
        for FIXTURE in $FIXTURES; do
          echo "--- replay against $FIXTURE"
          # The hub checkout carries stub_bevo.py and every fixture, so nothing is downloaded.
          python3 "$BUTLER_SKILLS_HUB/tests/replay.py" $FLAG "$SKILL_PATH" --fixture "$FIXTURE" --no-download \
            ${PARAMS_ARG:+"$PARAMS_ARG" "$PARAMS_JSON"}
        done
